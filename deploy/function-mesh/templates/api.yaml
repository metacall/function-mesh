apiVersion: apps/v1
kind: Deployment
metadata:
  name: function-mesh-api
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-api
    metacall.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: function-mesh-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: function-mesh-api
        metacall.io/component: api
      annotations:
        metacall.io/meta-ast-version: {{ .Values.api.planner.version | quote }}
        {{- if .Values.monitoring.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /metrics
        {{- end }}
        {{- if and .Values.cilium.enabled .Values.cilium.hubble.l7Visibility }}
        policy.cilium.io/proxy-visibility: "<Ingress/9000/TCP/HTTP>,<Egress/9090/TCP/HTTP>"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: function-mesh-api
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args:
            - --namespace={{ .Values.functionsNamespace }}
            - --router-url=http://function-mesh-router.{{ .Values.systemNamespace }}.svc.cluster.local:{{ .Values.router.service.port }}
            - --listen=:9000
            - --planner-enabled={{ .Values.api.planner.enabled }}
            - --planner-binary={{ .Values.api.planner.binary }}
            - --planner-timeout={{ .Values.api.planner.timeout }}
            - --planner-max-output-bytes={{ .Values.api.planner.maxOutputBytes | int64 }}
            - --planner-max-input-files={{ .Values.api.planner.maxInputFiles | int }}
            - --planner-max-input-bytes={{ .Values.api.planner.maxInputBytes | int64 }}
            - --max-configmap-bytes={{ .Values.api.planner.maxConfigMapBytes | int64 }}
          ports:
            - name: http
              containerPort: 9000
          livenessProbe:
            httpGet:
              path: /api/readiness
              port: http
          readinessProbe:
            httpGet:
              path: /api/readiness
              port: http
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: function-mesh-api
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-api
    metacall.io/component: api
  {{- if .Values.monitoring.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.api.service.port | quote }}
    prometheus.io/path: /metrics
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: function-mesh-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
