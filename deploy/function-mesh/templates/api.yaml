apiVersion: apps/v1
kind: Deployment
metadata:
  name: function-mesh-api
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-api
    metacall.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: function-mesh-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: function-mesh-api
        metacall.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: function-mesh-api
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args:
            - --namespace={{ .Values.functionsNamespace }}
            - --router-url=http://function-mesh-router.{{ .Values.systemNamespace }}.svc.cluster.local:{{ .Values.router.service.port }}
            - --listen=:9000
          ports:
            - name: http
              containerPort: 9000
          livenessProbe:
            httpGet:
              path: /api/readiness
              port: http
          readinessProbe:
            httpGet:
              path: /api/readiness
              port: http
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: function-mesh-api
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-api
    metacall.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: function-mesh-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
