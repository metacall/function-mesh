{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: function-mesh-api
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-api
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: function-mesh-api
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
---
{{- if .Values.router.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: function-mesh-router
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-router
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.router.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: function-mesh-router
                port:
                  number: {{ .Values.router.service.port }}
{{- end }}
