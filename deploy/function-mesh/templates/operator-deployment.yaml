apiVersion: apps/v1
kind: Deployment
metadata:
  name: function-mesh-operator
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: function-mesh-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: function-mesh-operator
        metacall.io/component: operator
      {{- if or .Values.monitoring.enabled (and .Values.cilium.enabled .Values.cilium.hubble.l7Visibility) }}
      annotations:
        {{- if .Values.monitoring.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        {{- end }}
        {{- if and .Values.cilium.enabled .Values.cilium.hubble.l7Visibility }}
        policy.cilium.io/proxy-visibility: "<Ingress/8080/TCP/HTTP>,<Ingress/8081/TCP/HTTP>,<Egress/8080/TCP/HTTP>"
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: function-mesh-operator
      containers:
        - name: manager
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --runtime-image={{ .Values.runtime.imageRepository }}
            - --runtime-cpu-request={{ .Values.runtime.defaultResources.requests.cpu }}
            - --runtime-memory-request={{ .Values.runtime.defaultResources.requests.memory }}
            - --runtime-cpu-limit={{ .Values.runtime.defaultResources.limits.cpu }}
            - --runtime-memory-limit={{ .Values.runtime.defaultResources.limits.memory }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --l7-visibility={{ .Values.cilium.hubble.l7Visibility }}
            {{- if .Values.tracing.enabled }}
            - --tracing-enabled={{ .Values.tracing.enabled }}
            - --tracing-endpoint={{ .Values.tracing.endpoint }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: function-mesh-operator
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-operator
    metacall.io/component: operator
  {{- if .Values.monitoring.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: function-mesh-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
