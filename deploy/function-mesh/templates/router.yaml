apiVersion: apps/v1
kind: Deployment
metadata:
  name: function-mesh-router
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-router
    metacall.io/component: router
spec:
  replicas: {{ .Values.router.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: function-mesh-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: function-mesh-router
        metacall.io/component: router
      {{- if and .Values.cilium.enabled .Values.cilium.hubble.l7Visibility }}
      annotations:
        policy.cilium.io/proxy-visibility: "<Ingress/9090/TCP/HTTP>,<Egress/8080/TCP/HTTP>"
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: function-mesh-router
      containers:
        - name: router
          image: "{{ .Values.router.image.repository }}:{{ .Values.router.image.tag }}"
          imagePullPolicy: {{ .Values.router.image.pullPolicy }}
          args:
            - --namespace={{ .Values.functionsNamespace }}
            - --listen=:9090
          ports:
            - name: http
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          {{- with .Values.router.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: function-mesh-router
  namespace: {{ .Values.systemNamespace }}
  labels:
    app.kubernetes.io/name: function-mesh-router
    metacall.io/component: router
spec:
  type: {{ .Values.router.service.type }}
  selector:
    app.kubernetes.io/name: function-mesh-router
  ports:
    - name: http
      port: {{ .Values.router.service.port }}
      targetPort: http
