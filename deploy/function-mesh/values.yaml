systemNamespace: metacall-system
functionsNamespace: metacall-functions

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

runtime:
  imageRepository: localhost:5000/metacall/function
  defaultResources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

operator:
  replicas: 1
  image:
    repository: localhost:5000/metacall/function-mesh-operator
    tag: dev
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

api:
  replicas: 1
  image:
    repository: localhost:5000/metacall/function-mesh-api
    tag: dev
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 9000
  ingress:
    enabled: true
    host: api.metacall.localhost
  planner:
    enabled: true
    version: '0.4.0'
    binary: /usr/local/bin/meta-ast
    timeout: 30s
    maxOutputBytes: 5242880
    maxInputFiles: 5000
    maxInputBytes: 52428800
    maxConfigMapBytes: 921600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

router:
  replicas: 1
  image:
    repository: localhost:5000/metacall/function-mesh-router
    tag: dev
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 9090
  ingress:
    enabled: true
    host: router.metacall.localhost
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

tracing:
  enabled: true
  endpoint: http://alloy.monitoring.svc.cluster.local:4318

monitoring:
  enabled: true
  namespace: monitoring
  serviceMonitors:
    enabled: true
  grafana:
    ingress:
      enabled: true
      host: grafana.metacall.localhost

cilium:
  enabled: true
  hubble:
    enabled: true
    l7Visibility: false
