apiVersion: apps/v1
kind: Deployment
metadata:
  name: function-mesh-api
  namespace: metacall-system
  labels:
    app.kubernetes.io/name: function-mesh-api
    metacall.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: function-mesh-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: function-mesh-api
        metacall.io/component: api
    spec:
      serviceAccountName: function-mesh-api
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: api
          image: localhost:5000/metacall/function-mesh-api:dev
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=metacall-functions
            - --router-url=http://function-mesh-router.metacall-system.svc.cluster.local:9090
            - --listen=:9000
          ports:
            - name: http
              containerPort: 9000
          livenessProbe:
            httpGet:
              path: /api/readiness
              port: http
          readinessProbe:
            httpGet:
              path: /api/readiness
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: function-mesh-api
  namespace: metacall-system
  labels:
    app.kubernetes.io/name: function-mesh-api
    metacall.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: function-mesh-api
  ports:
    - name: http
      port: 9000
      targetPort: http
